[project]
name = "anyhoi"
description = "Towards Unconstrained Human-Object Interaction"
version = "0.0.1"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = {file = "LICENSE"}
authors = [{name = "Francesco Tonini", email = "francesco@tonini.dev"}]
classifiers = [
  "Development Status :: 1 - Planning",
  "Environment :: GPU :: NVIDIA CUDA",
  "Intended Audience :: Developers",
  "Intended Audience :: Education",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Natural Language :: English",
  "Operating System :: Unix",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Scientific/Engineering :: Image Processing",
  "Topic :: Scientific/Engineering :: Image Recognition",
  "Topic :: Scientific/Engineering :: Information Analysis",
]

dependencies = [
  "accelerate>=1,<2",
  "bitsandbytes>=0,<1",
  "colorlog>=6,<7",
  "datasets>=3,<6",
  "einops>=0,<1",
  "gdown>=5,<6",
  "llava@git+https://github.com/LLaVA-VL/LLaVA-NeXT.git@79ef45a",
  "multiprocess>=0.70",
  "numpy>=1.26,<2",
  "pandas>=2,<3",
  "pip>=25,<26",
  "pytablewriter>=1,<2",
  "python-dotenv>=1,<2",
  "qwen_vl_utils>=0,<1",
  "sacrebleu>=2,<3",
  "scikit-learn>=1,<2",
  "sentencepiece>=0.2.0",
  "spacy>=3,<4",
  "tenacity>=9,<10",
  "timm>=1.0.13",
  "torchmetrics>=1,<2",
  "transformers==4.55.1",
  "torch>=2,<3",
  "torchvision>=0,<1",
  "xformers>=0.0.29.post1",
]

[dependency-groups]
data = [
  "datasets>=3,<6",
  "gdown>=5,<6",
  "pytablewriter>=1,<2",
  "sacrebleu>=2,<3",
  "scikit-learn>=1,<2",
  "spacy>=3,<4",
  "tenacity>=9,<10",
]
models = [
  "accelerate>=1,<2",
  "bitsandbytes>=0,<1",
  "einops>=0,<1",
  "llava@git+https://github.com/LLaVA-VL/LLaVA-NeXT.git@79ef45a",
  "qwen_vl_utils>=0,<1",
  "sentencepiece>=0.2.0",
  "timm>=1.0.13",
  "torchvision>=0,<1",
  "transformers==4.55.1",
  "xformers==0.0.29.post1",
]

[project.optional-dependencies]
nvidia = ["flash-attn>=2.7.3,<3"]

[project.urls]
Issues = "https://github.com/francescotonini/anyhoi/issues"
Repository = "https://github.com/francescotonini/anyhoi"

[tool.ruff]
cache-dir = "~/.cache/ruff"
include = ["notebooks", "src", "./*.py"]
line-length = 99
indent-width = 4
target-version = "py310"

[tool.ruff.lint]
select = [
    "F",    # Pyflakes
    "E",    # pycodestyle
    "D",    # pydocstyle
    "I",    # isort
    "UP",   # pyupgrade
    "ANN",  # flake8-annotations
    "S",    # flake8-bandit
    "B",    # flake8-bugbear
    "EXE",  # flake8-executable
    "G",    # flake8-logging-format
    "T20",  # flake9-print
    "SIM",  # flake8-simplify
]
ignore = ["D100", "D104", "D105", "D107", "D203", "D213", "ANN101", "ANN002", "ANN003", "ANN102", "S101"]
fixable = ["ALL"]
unfixable = []

[tool.ruff.lint.per-file-ignores]
"*.ipynb" = ["E501", "I", "ANN", "S", "G004", "T20"]
"eval_*.py" = ["T201"]

[tools.setuptools.dynamic]
version = {attr = "src.__version__"}
